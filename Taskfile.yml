# Release tasks for Timesheet for Jira. Run `task --list` to see them.
#
# There is no bundler: the extension runs from the repository root as plain ES modules.
# "Building" copies the runtime files into dist/<browser>/ and writes that browser's
# manifest; packaging validates the build and zips it into release/.
#
# Requires Task 3, jq, zip, and unzip.

version: '3'

set: [errexit, nounset, pipefail]

vars:
  CHROME_DIR: dist/chrome
  RELEASE_DIR: release
  CHROME_ZIP: '{{.RELEASE_DIR}}/timesheet-for-jira-chrome.zip'
  # Files and folders the extension loads at runtime. Everything else (tests, docs,
  # store listings, package.json) stays out of the package.
  RUNTIME_FILES: manifest.json background.js options.html options.css options.js
  RUNTIME_DIRS: icons src

tasks:
  default:
    cmds:
      - task --list
    silent: true

  check:tools:
    internal: true
    silent: true
    cmds:
      - |
        for tool in jq zip unzip; do
          command -v "$tool" >/dev/null || { echo "Missing required tool: $tool" >&2; exit 1; }
        done

  build:chrome:
    desc: Build the Chrome extension into dist/chrome/
    deps: [check:tools]
    silent: true
    cmds:
      - rm -rf '{{.CHROME_DIR}}'
      - mkdir -p '{{.CHROME_DIR}}'
      - |
        for file in {{.RUNTIME_FILES}}; do
          [ -f "$file" ] || { echo "Missing runtime file: $file" >&2; exit 1; }
        done
        # Copy runtime files except the manifest, which gets a Chrome-specific copy below.
        for file in {{.RUNTIME_FILES}}; do
          [ "$file" = manifest.json ] || cp "$file" '{{.CHROME_DIR}}/'
        done
        cp -R {{.RUNTIME_DIRS}} '{{.CHROME_DIR}}/'
        # Drop editor and OS clutter that may sit next to source files.
        find '{{.CHROME_DIR}}' \( -name '.*' -o -name '*~' -o -name '*.swp' -o -name 'Thumbs.db' \) -exec rm -rf {} +
      # The manifest is shared with Firefox. Chrome ignores the Firefox-only keys but lists
      # them as warnings on chrome://extensions, so the Chrome build leaves them out.
      - jq 'del(.browser_specific_settings) | del(.background.scripts)' manifest.json > '{{.CHROME_DIR}}/manifest.json'
      - echo "Built Chrome extension in {{.CHROME_DIR}}/"

  verify:chrome:
    desc: Check the Chrome build in dist/chrome/ before packaging
    deps: [check:tools]
    silent: true
    cmds:
      - |
        dir='{{.CHROME_DIR}}'
        [ -d "$dir" ] || { echo "Build output $dir/ does not exist. Run: task build:chrome" >&2; exit 1; }
        [ -n "$(find "$dir" -type f | head -n 1)" ] || { echo "Build output $dir/ is empty" >&2; exit 1; }
        [ -f "$dir/manifest.json" ] || { echo "Missing $dir/manifest.json" >&2; exit 1; }
        jq empty "$dir/manifest.json" 2>/dev/null || { echo "$dir/manifest.json is not valid JSON" >&2; exit 1; }
      - |
        manifest='{{.CHROME_DIR}}/manifest.json'
        fail() { echo "manifest.json: $1" >&2; exit 1; }
        [ "$(jq -r '.manifest_version' "$manifest")" = 3 ] || fail "manifest_version must be 3"
        for key in name version description; do
          [ -n "$(jq -r --arg k "$key" '.[$k] // empty' "$manifest")" ] || fail "missing \"$key\""
        done
        [ "$(jq -r '.description | length' "$manifest")" -le 132 ] || fail "description is longer than 132 characters"
        version="$(jq -r '.version' "$manifest")"
        echo "$version" | grep -Eq '^(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){0,3}$' \
          || fail "version \"$version\" is not 1 to 4 dot-separated integers"
        package_version="$(jq -r '.version' package.json)"
        [ "$version" = "$package_version" ] || fail "version $version does not match package.json ($package_version)"
        [ -n "$(jq -r '.icons["128"] // empty' "$manifest")" ] || fail "missing the 128 px icon the Chrome Web Store requires"
        [ -n "$(jq -r '.background.service_worker // empty' "$manifest")" ] || fail "missing background.service_worker"
      - |
        # Every file the manifest names must be in the build.
        dir='{{.CHROME_DIR}}'
        jq -r '[.icons[]?, .action.default_icon[]?, .background.service_worker?, .options_ui.page?] | map(select(. != null)) | .[]' \
          "$dir/manifest.json" | while read -r path; do
          [ -f "$dir/$path" ] || { echo "manifest.json names $path, which is not in the build" >&2; exit 1; }
        done
      - |
        # Local scripts, styles, and images in HTML pages must be in the build.
        dir='{{.CHROME_DIR}}'
        find "$dir" -name '*.html' | while read -r page; do
          { grep -oE '(src|href)="[^"]+"' "$page" || true; } | sed -E 's/^(src|href)="([^"#?]*).*$/\2/' | while read -r ref; do
            case "$ref" in ''|http:*|https:*|mailto:*|data:*) continue ;; esac
            [ -f "$(dirname "$page")/$ref" ] || { echo "${page#$dir/} references $ref, which is not in the build" >&2; exit 1; }
          done
        done
      - |
        # Relative ES module imports must resolve inside the build (comment lines are skipped).
        # grep finds nothing in files without imports, which is fine, hence the `|| true`.
        dir='{{.CHROME_DIR}}'
        find "$dir" -name '*.js' | while read -r script; do
          { grep -E "^[[:space:]]*(import|export|\})[^'\"]*['\"]\.{1,2}/[^'\"]+['\"]" "$script" || true; } \
            | sed -E "s/^.*['\"](\.{1,2}\/[^'\"]+)['\"].*$/\1/" | while read -r ref; do
            [ -f "$(dirname "$script")/$ref" ] || { echo "${script#$dir/} imports $ref, which is not in the build" >&2; exit 1; }
          done
        done
      - echo "Chrome build in {{.CHROME_DIR}}/ passed all checks"

  package:chrome:
    desc: Build, verify, and zip the Chrome extension for the Chrome Web Store
    silent: true
    cmds:
      - task: build:chrome
      - task: verify:chrome
      - mkdir -p '{{.RELEASE_DIR}}'
      - rm -f '{{.CHROME_ZIP}}'
      - |
        # Fixed timestamps, permissions, and file order, so the same sources give the same zip.
        find '{{.CHROME_DIR}}' -type d -exec chmod 755 {} +
        find '{{.CHROME_DIR}}' -type f -exec chmod 644 {} +
        find '{{.CHROME_DIR}}' -exec touch -t 198001010000 {} +
        zip_path="$(pwd)/{{.CHROME_ZIP}}"
        # Zip from inside the build so manifest.json sits at the root of the archive.
        cd '{{.CHROME_DIR}}'
        find . -type f | sed 's|^\./||' | LC_ALL=C sort | TZ=UTC zip -q -X -D "$zip_path" -@
      - |
        zip_file='{{.CHROME_ZIP}}'
        unzip -tq "$zip_file" >/dev/null || { echo "$zip_file failed the zip integrity test" >&2; exit 1; }
        unzip -Z1 "$zip_file" | grep -qx 'manifest.json' || { echo "manifest.json is not at the root of $zip_file" >&2; exit 1; }
        # The archive must hold exactly the files of the build: nothing missing, nothing extra.
        expected="$(cd '{{.CHROME_DIR}}' && find . -type f | sed 's|^\./||' | LC_ALL=C sort)"
        actual="$(unzip -Z1 "$zip_file" | LC_ALL=C sort)"
        [ "$expected" = "$actual" ] || { echo "$zip_file does not match {{.CHROME_DIR}}/" >&2; exit 1; }
      - |
        zip_file='{{.CHROME_ZIP}}'
        version="$(jq -r '.version' '{{.CHROME_DIR}}/manifest.json')"
        count="$(unzip -Z1 "$zip_file" | wc -l | tr -d ' ')"
        size="$(wc -c < "$zip_file" | tr -d ' ')"
        echo
        echo "Chrome Web Store package ready: version $version, $count files, $size bytes"
        echo "  $(pwd)/$zip_file"
        echo "Upload it at https://chrome.google.com/webstore/devconsole"

  clean:
    desc: Remove build output and release packages
    silent: true
    cmds:
      - rm -rf dist '{{.RELEASE_DIR}}'
